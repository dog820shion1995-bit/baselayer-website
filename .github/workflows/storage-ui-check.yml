name: BASELAYER Decision Report & Product Detail
on:
  pull_request:
    paths:
      - index.html
      - start.html
      - learn.html
      - compare.html
      - product.html
      - price-guide.html
      - journey.css
      - visual-story.css
      - visual-media.js
      - site-navigation.js
      - journey-app.js
      - product-editorial.js
      - official-prices.js
      - product-detail.js
      - price-guide.js
      - catalog-guide.js
      - storage-data.js
      - storage-policy.html
      - tools/test_storage.js
      - tools/browser_storage.mjs
      - .github/workflows/storage-ui-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check journey-app.js
          node --check product-editorial.js
          node --check official-prices.js
          node --check product-detail.js
          node --check price-guide.js
          node --check catalog-guide.js
          node --check visual-media.js
          node --check site-navigation.js
          node --check storage-data.js
          node --check tools/test_storage.js
          node --check tools/browser_storage.mjs
      - name: Source-backed data and site checks
        run: node tools/test_storage.js
  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: End-to-end site and responsive checks
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/storage-http.log 2>&1 &
          node tools/browser_storage.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baselayer-decision-report-screenshots
          path: |
            decision-home.png
            decision-report.png
            decision-mobile-product.png
            visual-product-desktop.png
          if-no-files-found: ignore

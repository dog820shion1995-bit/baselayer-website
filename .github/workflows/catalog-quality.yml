name: BASELAYER catalog data validation
on:
  pull_request:
    paths:
      - 'data/products.json'
      - 'data/relationships.json'
      - 'product-data.js'
      - 'relationship-data.js'
      - 'app-v31.js'
      - 'search.html'
      - 'nas-catalog-v32-preview.html'
      - 'nas-catalog-v32-data.js'
      - 'tools/build_v32_nas_bundle.py'
      - 'tools/validate_v32_preview.py'
      - 'tools/browser_v32.mjs'
      - 'tools/browser_v32_overlay.mjs'
      - 'tools/build_catalog.py'
      - 'tools/validate_v32_media.py'
      - 'tools/test_v32_media.py'
      - 'tools/test_v32_relationships.py'
      - 'tools/validate_relationships.py'
      - 'tools/catalog_quality.py'
      - 'tools/build_relationships.py'
      - '.github/workflows/catalog-quality.yml'
  push:
    branches: [main, feature/v32-catalog-media-office]
    paths:
      - 'data/products.json'
      - 'data/relationships.json'
      - 'product-data.js'
      - 'relationship-data.js'
      - 'app-v31.js'
      - 'search.html'
      - 'nas-catalog-v32-preview.html'
      - 'nas-catalog-v32-data.js'
      - 'tools/build_v32_nas_bundle.py'
      - 'tools/validate_v32_preview.py'
      - 'tools/browser_v32.mjs'
      - 'tools/browser_v32_overlay.mjs'
      - 'tools/build_catalog.py'
      - 'tools/validate_v32_media.py'
      - 'tools/test_v32_media.py'
      - 'tools/test_v32_relationships.py'
      - 'tools/validate_relationships.py'
      - 'tools/catalog_quality.py'
      - 'tools/build_relationships.py'
      - '.github/workflows/catalog-quality.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate product source records
        run: |
          python -m compileall -q tools
          python tools/build_catalog.py
          python tools/validate_v32_media.py
          python -m unittest discover -s tools -p 'test_v32_*.py' -v
          python tools/validate_relationships.py
          python tools/build_v32_nas_bundle.py
          python tools/validate_v32_preview.py
          python tools/build_relationships.py
          python tools/catalog_quality.py
          git diff --exit-code -- product-data.js relationship-data.js nas-catalog-v32-data.js

  browser-v32:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium for isolated v32 review smoke test
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify v32 NAS review page on desktop and mobile
        run: |
          node --check tools/browser_v32.mjs
          node --check tools/browser_v32_overlay.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/v32-http.log 2>&1 &
          node tools/browser_v32.mjs
      - name: Checkout current public main into an isolated staging directory
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-snapshot
      - name: Stage only the two independent v32 NAS files and run main regression
        run: |
          test -f main-snapshot/journey-app.js
          test -f main-snapshot/catalog-guide.js
          # Before first publication, stage the two files without overwriting main.
          # After publication, demand byte-for-byte parity with the reviewed release.
          if test -e main-snapshot/nas-catalog-v32-preview.html || test -e main-snapshot/nas-catalog-v32-data.js; then
            test -f main-snapshot/nas-catalog-v32-preview.html
            test -f main-snapshot/nas-catalog-v32-data.js
            cmp nas-catalog-v32-preview.html main-snapshot/nas-catalog-v32-preview.html
            cmp nas-catalog-v32-data.js main-snapshot/nas-catalog-v32-data.js
          else
            cp nas-catalog-v32-preview.html nas-catalog-v32-data.js main-snapshot/
          fi
          python3 -m http.server 8766 --bind 127.0.0.1 --directory main-snapshot >/tmp/v32-overlay-http.log 2>&1 &
          node tools/browser_v32_overlay.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v32-nas-review-screenshots
          path: |
            v32-nas-desktop.png
            v32-nas-mobile.png
            v32-overlay-desktop.png
            v32-overlay-mobile.png
          if-no-files-found: ignore

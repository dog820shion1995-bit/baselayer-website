<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>BASELAYER v32 NAS review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f7fa;color:#193247;font:15px/1.7 system-ui,"Noto Sans JP",sans-serif}header{background:#132d43;color:white;padding:38px max(18px,calc((100vw - 1080px)/2))}h1{font-size:clamp(26px,4vw,42px);margin:5px 0}header p{max-width:760px}main{max-width:1120px;margin:auto;padding:24px 18px}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0 24px}input,select{font:inherit;padding:12px;border:1px solid #bbccd7;border-radius:9px;background:white}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}.card{border:1px solid #d9e3ea;border-radius:14px;overflow:hidden;background:white}.media{height:168px;display:grid;place-items:center;background:linear-gradient(140deg,#dceaf1,#f7fafc)}.media img{width:100%;height:100%;object-fit:contain;padding:12px}.placeholder{color:#557589;font-weight:700;text-align:center}.placeholder:before{content:"▣";display:block;font-size:64px;color:#7d9bad}.body{padding:16px}.brand{color:#58768b;font-size:12px}.model{font-size:22px;font-weight:800}.desc{font-size:13px;color:#546c7b}details{border-top:1px solid #e1e9ef;margin-top:14px;padding-top:10px}summary{font-weight:700;cursor:pointer}dl{font-size:12px;display:grid;grid-template-columns:1fr 1.6fr;gap:8px}dt{font-weight:700}dd{margin:0}a{color:#136184;overflow-wrap:anywhere}.credit{display:block;font-size:11px;padding:7px 14px;line-height:1.7}.credit a{margin-right:5px}.credit .modifications{display:block;color:#526879}.source{display:block;margin-top:12px;font-size:13px}.caution{font-size:12px;color:#526879}li{margin:12px 0}@media(max-width:500px){.controls>*{width:100%}.media{height:150px}}
</style><script defer src="product-data.js"></script><script defer src="relationship-data.js"></script></head>
<body><header><small>BASELAYER / v32 REVIEW ONLY</small><h1>NASを型番から探して比較。</h1><p>メーカー公式仕様を記録したNASの検証用カタログです。権利確認済みの実物写真だけを表示し、未確認の写真は掲載しません。価格・在庫・互換性は未確認です。</p></header>
<main><div class="controls"><input id="search" type="search" aria-label="型番検索" placeholder="型番を検索（例 TS-464）"><select id="brand" aria-label="メーカー"><option value="">全メーカー</option><option>Synology</option><option>QNAP</option></select></div><p id="count" aria-live="polite"></p><div id="grid" class="grid"></div><h2>比較候補（公式後継ではありません）</h2><ul id="rels"></ul><p class="caution">メーカー・OSが異なる機種間のデータ移行、アプリ、HDD、保守の互換性は保証しません。</p></main>
<script>
document.addEventListener('DOMContentLoaded',()=>{
const products=(window.BASELAYER_PRODUCTS||[]).filter(p=>p.cat==='server'&&['Synology','QNAP'].includes(p.brand));
const el=(tag,cls,txt)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n};
const validUrl=s=>{try{const u=new URL(s);return u.protocol==='https:'&&!!u.hostname&&!u.username&&!u.password}catch{return false}};
const allowed=p=>{const i=p.image;if(!i||i.usage!=='permitted'||i.brand!==p.brand||i.model!==p.model||!i.creator||!i.checked||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(i.checked)||i.checked>new Date(Date.now()+9*3600000).toISOString().slice(0,10))return false;
const licenses={'CC0':'https://creativecommons.org/publicdomain/zero/1.0/','CC BY 2.0':'https://creativecommons.org/licenses/by/2.0/','CC BY 3.0':'https://creativecommons.org/licenses/by/3.0/','CC BY 4.0':'https://creativecommons.org/licenses/by/4.0/','CC BY-SA 3.0':'https://creativecommons.org/licenses/by-sa/3.0/','CC BY-SA 4.0':'https://creativecommons.org/licenses/by-sa/4.0/'};
if(!licenses[i.license]||i.licenseUrl!==licenses[i.license]||!validUrl(i.url)||!validUrl(i.source)||i.source!==i.rightsEvidence)return false;
try{const a=new URL(i.source),b=new URL(i.url),file=decodeURIComponent(a.pathname.split('/wiki/File:')[1]||''),redirect=decodeURIComponent(b.pathname.split('/wiki/Special:Redirect/file/')[1]||'');
const stem=file.replace(/\.[^.]+$/,'').toLowerCase(),model=p.model.toLowerCase(),pos=stem.indexOf(model);const before=pos>0?stem[pos-1]:'',after=pos>=0?stem[pos+model.length]||'':'';const boundary=c=>!c||!/[a-z0-9+]/i.test(c);return a.hostname==='commons.wikimedia.org'&&b.hostname==='commons.wikimedia.org'&&a.pathname.startsWith('/wiki/File:')&&b.pathname.startsWith('/wiki/Special:Redirect/file/')&&file===redirect&&pos>=0&&boundary(before)&&boundary(after)}catch{return false}};
function card(p){const a=el('article','card'),m=el('div','media'),placeholder=()=>el('div','placeholder','製品写真未確認 / NAS');m.append(placeholder());a.append(m);
if(allowed(p)){const i=p.image,img=el('img');img.loading='eager';img.alt=p.brand+' '+p.model+'の実物写真';img.onload=()=>m.replaceChildren(img);img.onerror=()=>{m.replaceChildren(placeholder());credit.remove()};img.src=i.url;const credit=el('div','credit'),origin=el('a','','写真: '+i.creator),license=el('a','',i.license);origin.href=i.source;license.href=i.licenseUrl;for(const link of [origin,license]){link.target='_blank';link.rel='noopener noreferrer'}credit.append(origin,license);if(i.modifications)credit.append(el('span','modifications','加工: '+i.modifications));a.append(credit)}
const body=el('div','body');body.append(el('div','brand',p.brand),el('div','model',p.model),el('div','desc',p.category));const d=el('details'),dl=el('dl');for(const [k,v] of Object.entries(p.specs||{}))dl.append(el('dt','',k),el('dd','',v));d.append(el('summary','','確認済み仕様を見る'),dl);body.append(d,el('p','caution',p.memo||''));if(validUrl(p.source)){const link=el('a','source','メーカー公式仕様を見る');link.href=p.source;link.target='_blank';link.rel='noopener noreferrer';body.append(link)}a.append(body);return a}
const grid=document.getElementById('grid'),search=document.getElementById('search'),brand=document.getElementById('brand');function render(){const q=search.value.toLowerCase().trim(),b=brand.value,rows=products.filter(p=>(!b||p.brand===b)&&(!q||(p.brand+' '+p.model).toLowerCase().includes(q)));grid.replaceChildren(...rows.map(card));document.getElementById('count').textContent=rows.length+'機種';if(!rows.length)grid.append(el('p','','一致する型番はありません。'))}
const ul=document.getElementById('rels');for(const r of window.BASELAYER_RELATIONSHIPS||[]){if(r.relation!=='suggested_alternative'||!products.some(p=>p.brand===r.from_brand&&p.model===r.from_model)||!products.some(p=>p.brand===r.to_brand&&p.model===r.to_model))continue;const li=el('li','',r.from_model+' → '+r.to_model+'：'+r.note);if(validUrl(r.source)){const link=el('a','',' 出典');link.href=r.source;link.target='_blank';link.rel='noopener noreferrer';li.append(link)}ul.append(li)}
search.addEventListener('input',render);brand.addEventListener('change',render);render();
});
</script></body></html>
